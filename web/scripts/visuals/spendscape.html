<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Spendscape: anonymized rebuild of three payment-data dashboards. Fictional brand and data, no client marks. -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #141413; --top: #1b1b1a; --nav: #333; --line: #ccc; --box: #efefef; --side: #f6f6f6;
    --orange: #f28c00; --orange-l: #f8c580; --orange-xl: #fde3bf; --dark-orange: #ff661c; --red: #d1282d; --yellow: #f79e1b;
    --green: #8cba2d; --green-l: #d4e9a6; --teal: #4fccaf;
    --pill-g: #1f8f1f; --pill-r: #d62b2b;
    --ok: #0d9b7d; --ok-l: #e6f8f1; --ko: #b81c25; --ko-l: #f6d9db;
    --sea: #f6f5f2; --land: #ecebe7;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { overflow: hidden; font-family: "DM Sans", sans-serif; color: var(--ink); background: #fff; }
  .view { display: none; position: relative; overflow: hidden; }
  .view.on { display: block; }
  .abs { position: absolute; }
  svg text { font-family: "DM Sans", sans-serif; }

  /* ---------- tourism insights ---------- */
  .t-top { height: 40px; background: var(--top); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; }
  .brand b { font-weight: 700; letter-spacing: -.02em; }
  .brand span { font-weight: 300; }
  .user { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .t-nav { height: 64px; background: var(--nav); color: #fff; display: flex; gap: 40px; padding: 0 50px; align-items: center; font-size: 15px; }
  .t-nav div { position: relative; }
  .t-nav .on::after { content: ""; position: absolute; left: -10px; right: -10px; bottom: -21px; height: 3px; background: #fff; }
  .t-filters { padding: 30px 40px 20px; border-bottom: 1px solid #e4e4e4; }
  .row1 { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  .row1 b { font-weight: 700; margin-right: 2px; }
  .search { width: 246px; height: 40px; border: 1.5px solid var(--ink); border-radius: 20px; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 14px; }
  .search span { flex: 1; } .search .ph { color: #555; }
  .search .sep { width: 1.5px; height: 18px; background: var(--ink); }
  .toggle { width: 32px; height: 16px; border-radius: 8px; background: #d9481c; position: relative; margin-left: 12px; }
  .toggle i { position: absolute; right: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  .small { font-size: 12.5px; }
  .row2 { display: flex; align-items: flex-end; gap: 20px; margin-top: 26px; }
  .field label { display: block; font-size: 12px; margin-bottom: 6px; }
  .sel { width: 157px; height: 40px; border: 1px solid #8a8a8a; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 14px; color: #333; }
  .dlbtn { width: 40px; height: 40px; border: 1px solid #8a8a8a; display: grid; place-items: center; }
  .mapwrap { position: relative; background: var(--sea); border-bottom: 1px solid #e4e4e4; }
  .mapwrap svg { display: block; }
  .mapbtn { position: absolute; left: 50%; transform: translateX(-50%); width: 40px; height: 40px; border: 1px solid #555; background: #fff; display: grid; place-items: center; border-radius: 3px; }
  .t-body { padding: 30px 40px 40px; display: flex; flex-direction: column; gap: 38px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .kpi { box-shadow: 0 1px 6px rgba(0,0,0,.2); padding: 22px 28px 20px; border-radius: 2px; }
  .kl { font-size: 15px; font-weight: 500; text-transform: uppercase; letter-spacing: .01em; }
  .kv { font-size: 30px; font-weight: 700; margin: 22px 0 26px; }
  .kd { display: flex; align-items: center; gap: 12px; font-size: 13.5px; color: #333; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 19px; padding: 0 11px; border-radius: 10px; color: #fff; font-size: 12.5px; font-weight: 500; }
  .pill.g { background: var(--pill-g); } .pill.r { background: var(--pill-r); }
  .panel { box-shadow: 0 1px 6px rgba(0,0,0,.2); padding: 20px 20px 22px; border-radius: 2px; }
  .ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 30px; }
  .meta { font-size: 11px; color: #333; }
  .pt { font-size: 19px; font-weight: 500; margin-top: 4px; display: flex; align-items: center; gap: 16px; }
  .pic { display: flex; gap: 12px; margin-left: auto; padding-top: 14px; }
  .showmore { text-align: center; font-size: 12px; margin-top: 30px; display: flex; justify-content: center; align-items: center; gap: 8px; }
  .two { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 26px; margin-top: 20px; }
  .two .div { background: #e4e4e4; }
  .hbt { text-align: center; font-size: 13px; font-weight: 500; margin-bottom: 14px; }
  .hbg { display: grid; grid-template-columns: 86px 1fr 92px; row-gap: 7px; align-items: center; }
  .hl { font-size: 11.5px; text-align: right; padding-right: 8px; line-height: 1.05; }
  .htrack { position: relative; height: 18px; border-left: 1px solid #999; }
  .hbar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--orange); }
  .hv { position: absolute; top: 1px; margin-left: 4px; font-size: 12px; }
  .hp { padding-left: 22px; }
  .hax { position: relative; height: 22px; border-left: 1px solid #999; border-top: 1px solid #999; }
  .hax span { position: absolute; top: 6px; transform: translateX(-50%); font-size: 10.5px; }
  .compare-row { display: flex; justify-content: flex-end; align-items: center; gap: 14px; font-size: 14px; }
  .compare-row b { font-weight: 700; }
  .alert { display: flex; align-items: center; border: 1px solid var(--orange); height: 56px; }
  .alert i { width: 40px; height: 100%; background: var(--orange); display: grid; place-items: center; }
  .alert span { flex: 1; padding-left: 16px; font-size: 15px; }
  .t-foot { background: var(--top); color: #fff; font-size: 10px; height: 40px; display: flex; align-items: center; padding: 0 20px; gap: 10px; }
  .t-foot b { font-weight: 600; border-left: 1px solid #fff; padding-left: 10px; }

  /* ---------- domestic tourism ---------- */
  .d-wrap { display: flex; min-height: 1100px; }
  .d-side { width: 330px; flex: none; background: var(--side); padding: 32px 28px; display: flex; flex-direction: column; gap: 30px; }
  .d-side .brand { color: var(--ink); font-size: 18px; }
  .d-sub { font-size: 12.5px; color: #555; margin-top: 4px; padding-left: 34px; }
  .d-h { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .d-box { background: #fff; border: 1px solid #ddd; border-radius: 8px; height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 14px; }
  .slider { position: relative; height: 6px; background: #ddd; border-radius: 3px; margin: 22px 6px 8px; }
  .slider i { position: absolute; top: 0; bottom: 0; background: var(--orange); border-radius: 3px; }
  .slider b { position: absolute; top: -6px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--orange); transform: translateX(-50%); }
  .slabels { display: flex; justify-content: space-between; font-size: 11.5px; color: #666; }
  .d-chk { display: flex; align-items: center; gap: 8px; font-size: 13.5px; margin-top: 12px; }
  .d-chk i { width: 16px; height: 16px; border-radius: 4px; background: var(--orange); display: grid; place-items: center; }
  .legend-grad { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #fde9cc, #f6b04f, #f28c00, #c2410c); margin-top: 10px; }
  .d-main { flex: 1; padding: 30px 56px 50px; }
  .d-nav { display: flex; align-items: center; justify-content: space-between; }
  .d-tabs { display: flex; gap: 34px; font-size: 15px; }
  .d-tabs div { padding-bottom: 10px; color: #555; }
  .d-tabs .on { color: var(--ink); font-weight: 600; border-bottom: 3px solid var(--orange); }
  .seg { display: flex; background: var(--box); border-radius: 8px; padding: 3px; font-size: 13.5px; }
  .seg div { padding: 7px 16px; border-radius: 6px; color: #555; }
  .seg .on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .d-right { display: flex; gap: 14px; align-items: center; }
  .lang { border: 1px solid #ddd; border-radius: 8px; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 13.5px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 600; }
  .d-title { margin-top: 44px; display: flex; align-items: baseline; gap: 16px; }
  .d-title h1 { font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
  .d-title span { font-size: 14px; color: #666; }
  .d-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 26px; }
  .d-kpi { border: 1px solid #e3e3e3; border-radius: 10px; padding: 18px 20px; }
  .d-kpi .l { font-size: 13px; color: #555; }
  .d-kpi .v { font-size: 30px; font-weight: 700; margin: 10px 0 12px; letter-spacing: -.01em; }
  .vbox { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 8px; border-radius: 5px; }
  .vbox.ok { color: var(--ok); background: var(--ok-l); } .vbox.ko { color: var(--ko); background: var(--ko-l); }
  .d-card { border: 1px solid #e3e3e3; border-radius: 10px; padding: 22px 24px; margin-top: 22px; }
  .d-card h3 { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .d-card .cap { font-size: 12.5px; color: #666; margin-top: 3px; }
  .stack { display: grid; grid-template-columns: 90px 1fr; row-gap: 12px; margin-top: 20px; align-items: center; font-size: 13px; }
  .stack .bars { display: flex; height: 24px; border-radius: 4px; overflow: hidden; }
  .stack .bars i { display: block; height: 100%; border-right: 2px solid #fff; }
  .leg { display: flex; gap: 20px; font-size: 12.5px; margin-top: 18px; color: #333; }
  .leg span { display: flex; align-items: center; gap: 7px; }
  .leg i { width: 11px; height: 11px; border-radius: 3px; display: block; }
  .d-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 22px; }
  .rank { margin-top: 14px; }
  .rank div { display: grid; grid-template-columns: 22px 1fr auto auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid #eee; font-size: 13.5px; }
  .rank div:last-child { border: 0; }
  .rank em { font-style: normal; color: #888; font-size: 12px; }

  /* ---------- merchant payments ---------- */
  .m-wrap { display: flex; min-height: 1250px; }
  .m-side { width: 112px; flex: none; background: var(--side); display: flex; flex-direction: column; align-items: center; padding: 26px 0; gap: 8px; }
  .m-item { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; font-size: 11.5px; color: #555; position: relative; }
  .m-item.on { color: var(--ink); font-weight: 600; background: #fff; }
  .m-item.on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--orange); }
  .m-main { flex: 1; padding: 34px 48px 50px; }
  .m-head { display: flex; justify-content: space-between; align-items: center; }
  .m-head h1 { font-size: 36px; font-weight: 700; letter-spacing: -.02em; }
  .m-tabs { display: flex; gap: 6px; margin-top: 22px; border-bottom: 1px solid #ddd; }
  .m-tabs div { padding: 10px 18px; font-size: 14.5px; color: #555; }
  .m-tabs .on { color: var(--ink); font-weight: 600; border-bottom: 3px solid var(--orange); margin-bottom: -1px; }
  .m-filter { display: flex; gap: 14px; align-items: flex-end; background: var(--box); padding: 16px 18px; border-radius: 4px; margin-top: 24px; }
  .m-filter .sel { background: #fff; border-color: #bbb; width: 186px; border-radius: 3px; }
  .m-filter .dlbtn { background: #fff; border-color: #bbb; border-radius: 3px; }
  .m-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 26px; }
  .m-kpi { box-shadow: 0 1px 6px rgba(0,0,0,.18); border-radius: 4px; padding: 18px 24px; }
  .m-kpi .l { font-size: 13px; color: #444; display: flex; align-items: center; gap: 6px; }
  .m-kpi .v { font-size: 36px; font-weight: 700; margin: 8px 0 6px; letter-spacing: -.01em; }
  .m-kpi .d { font-size: 12.5px; color: #555; }
  .m-kpi .d b { color: var(--ok); font-weight: 600; } .m-kpi .d b.ko { color: var(--ko); }
  .m-row { display: grid; grid-template-columns: 1.55fr 1fr; gap: 20px; margin-top: 22px; }
  .m-card { box-shadow: 0 1px 6px rgba(0,0,0,.18); border-radius: 4px; padding: 20px 22px; }
  .m-card h3 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .m-card .cap { font-size: 12px; color: #666; margin-top: 3px; }
  .prog { margin-top: 18px; display: flex; flex-direction: column; gap: 14px; }
  .prog div { display: grid; grid-template-columns: 120px 1fr 56px; gap: 14px; align-items: center; font-size: 13px; }
  .prog .t { height: 12px; background: var(--chart, #e1e1e1); border-radius: 6px; overflow: hidden; }
  .prog .t i { display: block; height: 100%; background: var(--orange); border-radius: 6px; }
  .prog b { font-weight: 600; text-align: right; }
  .m-three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 22px; }
  .ring { display: flex; align-items: center; gap: 18px; margin-top: 16px; }
  .ring .l { font-size: 12.5px; color: #555; line-height: 1.5; }
  .ring .l b { display: block; font-size: 22px; color: var(--ink); }

  /* ---------- extra screens ---------- */
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { text-align: left; font-weight: 600; color: #444; background: var(--side); padding: 11px 14px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  .tbl td { padding: 11px 14px; border-bottom: 1px solid #eee; white-space: nowrap; }
  .tbl .r { text-align: right; }
  .mini { display: inline-block; width: 90px; height: 8px; background: #eee; border-radius: 4px; vertical-align: middle; margin-right: 10px; overflow: hidden; }
  .mini i { display: block; height: 100%; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 18px; background: #fff1dc; color: #a95b00; font-size: 13px; font-weight: 500; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 8px; background: var(--orange); color: #fff; font-weight: 600; font-size: 14px; }
  .btn.dark { background: var(--ink); }
  .input { height: 46px; border: 1px solid #ccc; border-radius: 8px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; color: #333; }
  .tog { width: 40px; height: 22px; border-radius: 11px; background: #ccc; position: relative; flex: none; }
  .tog.on { background: var(--orange); }
  .tog i { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  .tog.on i { left: 21px; }
  .status { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 10px; }
  .status.ok { color: var(--ok); background: var(--ok-l); } .status.wait { color: #a95b00; background: #fff1dc; } .status.off { color: #777; background: #eee; }
  .modal-bg { position: absolute; inset: 0; background: rgba(20,20,19,.5); }
  .modal { position: absolute; left: 50%; top: 110px; transform: translateX(-50%); width: 620px; background: #fff; border-radius: 14px; padding: 30px 34px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }

  /* ---------- covers ---------- */
  .stage { position: absolute; transform-origin: 0 0; }
  .shot { position: absolute; border: 0; background: #fff; box-shadow: 0 40px 60px rgba(20,20,19,.28), 0 6px 14px rgba(20,20,19,.18); }
  .title { font-weight: 700; letter-spacing: -.045em; line-height: .9; }
</style>
</head>
<body>

<!-- Screens are generated by the builders at the bottom; covers place the screens in tilted iframes. -->
<section class="view" id="screen-overview" style="width:1440px"></section>
<section class="view" id="screen-origins" style="width:1440px"></section>
<section class="view" id="screen-comparison" style="width:1440px"></section>
<section class="view" id="screen-compare-empty" style="width:1440px"></section>
<section class="view" id="screen-domestic" style="width:1440px"></section>
<section class="view" id="screen-merchant" style="width:1440px"></section>

<!-- ============ HERO 2400x1200 ============ -->
<!-- Title on charcoal, the rebuilt screens tilted on the right, warm glow tinting the screens -->
<section class="view" id="hero" style="width:2400px;height:1200px;background:#141413">
  <div class="stage" data-iso="hero"></div>
  <div class="abs" style="inset:0;background:radial-gradient(55% 75% at 90% 80%, rgba(242,140,0,.42), rgba(255,102,28,.18) 55%, transparent 85%);mix-blend-mode:multiply"></div>
  <div class="abs" style="inset:0;background:linear-gradient(90deg,#141413 0%,#141413 50%,rgba(20,20,19,.85) 60%,rgba(20,20,19,.3) 72%,rgba(20,20,19,0) 84%)"></div>
  <div class="abs" style="inset:0;background:radial-gradient(40% 50% at 12% 100%, rgba(255,102,28,.22), transparent 70%)"></div>
  <div class="abs title" style="left:140px;top:470px;font-size:262px;color:#fff">spend<span style="color:#f79e1b">scape</span></div>
</section>

<!-- ============ CARD 1200x1500 ============ -->
<section class="view" id="card" style="width:1200px;height:1500px;background:#141413">
  <div class="stage" data-iso="card"></div>
  <div class="abs" style="inset:0;background:radial-gradient(75% 55% at 75% 90%, rgba(242,140,0,.42), rgba(255,102,28,.18) 55%, transparent 85%);mix-blend-mode:multiply"></div>
  <div class="abs" style="inset:0;background:linear-gradient(180deg,#141413 0%,#141413 22%,rgba(20,20,19,.85) 31%,rgba(20,20,19,.3) 44%,rgba(20,20,19,0) 56%)"></div>
  <div class="abs title" style="left:92px;top:120px;font-size:196px;color:#fff">spend<span style="color:#f79e1b">scape</span></div>
</section>

<!-- ============ SHOWCASE 2400x1350 (body) ============ -->
<section class="view" id="showcase" style="width:2400px;height:1350px;background:#efede8">
  <div class="stage" data-iso="showcase"></div>
</section>
<script>
  const v = new URLSearchParams(location.search).get("v") || "hero";
  // Screens without a static section get one, so every builder can be picked with ?v=
  let section = document.getElementById(v);
  if (!section) { section = document.createElement("section"); section.id = v; section.className = "view"; section.style.width = "1440px"; document.body.prepend(section); }
  section.classList.add("on");
</script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
/* ===================== shared bits ===================== */
const I = {
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>',

  dl: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11m-5-5 5 5 5-5M4 16v4h16v-4"/></svg>',
  expand: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5M4 4l5 5M20 4l-5 5M20 20l-5-5M4 20l5-5"/></svg>',
  info: '<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#141413"/><path d="M12 10.5v6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="7.3" r="1.4" fill="#fff"/></svg>',
  up2: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 12 6-6 6 6M6 19l6-6 6 6"/></svg>',
  down2: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 5 6 6 6-6M6 12l6 6 6-6"/></svg>',
  warn: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>',
  x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5l14 14M19 5 5 19"/></svg>',
};
// Fictional mark: three stacked bars in warm tones
const mark = (h = 20) => `<svg width="${h * 1.15}" height="${h}" viewBox="0 0 23 20"><rect width="23" height="5.2" rx="2.6" fill="#d1282d"/><rect y="7.4" width="17" height="5.2" rx="2.6" fill="#ff661c"/><rect y="14.8" width="10.5" height="5.2" rx="2.6" fill="#f79e1b"/></svg>`;
const tri = (up) => `<svg width="8" height="7" viewBox="0 0 8 7"><path d="${up ? "M4 0 8 7H0z" : "M0 0h8L4 7z"}" fill="#fff"/></svg>`;
const pill = (v, up) => `<span class="pill ${up ? "g" : "r"}">${tri(up)} ${v}%</span>`;
const fmt = (n) => n.toFixed(1) + "%";

/* ===================== tourism insights ===================== */
const tTabs = ["Overview", "Origins", "Categories", "Comparison"];
function tHeader(active) {

  <div class="t-nav">${tTabs.map((t, i) => `<div class="${i === active ? "on" : ""}">${t}</div>`).join("")}</div>`;
}
const defaultFields = [["Performance Metric", "Spend Share"], ["Showing", "Weeks"], ["From", "Week 8 / 2024", "cal"], ["To", "Week 2 / 2025", "cal"], ["Compare", "YoY"], ["Data Type", "Cross border"]];
function tFilters(dest, extra = "") {

  <div class="row2">${defaultFields.map(([l, v, ic]) => `<div class="field"><label>${l}</label><div class="sel">${v}${ic ? I.cal : I.chev}</div></div>`).join("")}<div class="dlbtn">${I.dl}</div></div></div>`;
}
function tMap(open) {

    ? `<div class="mapwrap"><svg data-map="europe" width="1440" height="500"></svg><div class="mapbtn" style="bottom:16px">${I.up2}</div></div>`
    : `<div class="mapwrap"><svg data-map="strip" width="1440" height="100"></svg><div class="mapbtn" style="top:30px">${I.down2}</div></div>`;
}
const tFoot = `<div class="t-foot">© 2025 Spendscape <b>Terms of Use, Privacy Policy, and Cookie Notice</b></div>`;
function kpis(items) {
  return `<div class="kpis">${items.map((k) => `<div class="kpi"><div class="kl">${k.l}</div><div class="kv">${k.v}</div><div class="kd">${pill(k.d, k.up)}<span>${k.n}</span></div></div>`).join("")}</div>`;

function panel(title, body, extra = "") {
  return `<div class="panel"><div class="ph"><div><div class="meta">Week 8 / 2024 - Week 2 / 2025, USD ($)</div><div class="pt">${title} ${I.info}</div></div>${extra}<div class="pic">${I.expand}${I.dl}</div></div>${body}</div>`;
}
function hbars(title, rows, max = 10) {
  const ticks = [...Array(max + 1).keys()];
  return `<div><div class="hbt">${title}</div><div class="hbg">${rows.map(([l, v, d, u]) => `<div class="hl">${l}</div><div class="htrack"><div class="hbar" style="width:${(v / max) * 100}%"></div><span class="hv" style="left:${(v / max) * 100}%">${fmt(v)}</span></div><div class="hp">${pill(d, u)}</div>`).join("")}
  <div></div><div class="hax">${ticks.map((t) => `<span style="left:${(t / max) * 100}%">${t}%</span>`).join("")}</div><div></div></div></div>`;
}
const showMore = `<div class="showmore">Show more ${I.chev}</div>`;

// Vertical bars with optional dashed variation line, as in "Top Subregions"
function columns({ w = 1340, h = 300, cats, vals, colors, hi, line, legend, tip }) {
  const L = 50, R = line ? 46 : 14, T = 46, B = 40, pw = w - L - R, ph = h - T - B, max = 10;
  const y = (v) => T + ph - (v / max) * ph, bw = pw / cats.length;
  let s = `<svg width="${w}" height="${h}">`;
  for (let i = 0; i < max; i += 2) s += `<rect x="${L}" y="${y(i + 2)}" width="${pw}" height="${ph / 5}" fill="#f6f5f3"/>`;
  for (let i = 0; i <= max; i++) {
    s += `<text x="${L - 10}" y="${y(i) + 4}" font-size="11" text-anchor="end">${i}%</text>`;
    if (line) s += `<text x="${w - R + 10}" y="${y(i) + 4}" font-size="11">${i}%</text>`;
  }
  s += `<line x1="${L}" x2="${L}" y1="${T}" y2="${T + ph}" stroke="#999"/><line x1="${L}" x2="${L + pw}" y1="${T + ph}" y2="${T + ph}" stroke="#999"/>`;
  if (line) s += `<line x1="${w - R}" x2="${w - R}" y1="${T}" y2="${T + ph}" stroke="#999"/>`;
  cats.forEach((c, i) => {
    const x = L + i * bw + 5, isHi = i === hi;
    s += `<rect x="${x}" y="${y(vals[i])}" width="${bw - 10}" height="${T + ph - y(vals[i])}" fill="${colors ? colors[i] : isHi ? "#b7cf82" : "#e8eedb"}"/>`;
    s += `<text x="${x + (bw - 10) / 2}" y="${y(vals[i]) - 8}" font-size="12" text-anchor="middle" fill="${isHi ? "#141413" : "#aaa"}">${fmt(vals[i])}</text>`;
    s += `<text x="${L + i * bw + bw / 2}" y="${T + ph + 22}" font-size="11.5" text-anchor="middle">${c}</text>`;
  });
  s += `<line x1="${L}" x2="${L + pw}" y1="${y(5)}" y2="${y(5)}" stroke="#333" stroke-dasharray="3 3"/>`;
  if (line) {
    const pts = line.map((v, i) => [L + i * bw + bw / 2, y(v)]);
    s += `<path d="M${pts.map((p) => p.join(",")).join("L")}" fill="none" stroke="#d9481c" stroke-width="2.5" stroke-dasharray="7 5"/>`;
    s += `<circle cx="${pts[hi][0]}" cy="${pts[hi][1]}" r="6" fill="#d9481c"/>`;
  }
  if (legend) {
    let lx = w - R - legend.reduce((a, l) => a + l[0].length * 6.4 + 46, 0);
    legend.forEach(([t, c, dash]) => {
      s += dash ? `<line x1="${lx}" x2="${lx + 26}" y1="12" y2="12" stroke="${c}" stroke-width="2.5" stroke-dasharray="5 3"/>` : `<rect x="${lx}" y="6" width="12" height="12" fill="${c}"/>`;
      s += `<text x="${lx + (dash ? 30 : 17)}" y="16" font-size="11.5">${t}</text>`;
      lx += t.length * 6.4 + 46;
    });
  }
  if (tip) {
    const x = L + hi * bw + bw / 2 - 52, ty = y(vals[hi]) + 22;
    s += `<g filter="drop-shadow(0 2px 4px rgba(0,0,0,.2))"><rect x="${x}" y="${ty}" width="${tip.w || 130}" height="${tip.rows.length * 20 + 16}" fill="#fff"/></g>`;
    tip.rows.forEach(([t, val, c, dash], i) => {
      const yy = ty + 22 + i * 20;
      s += dash ? `<line x1="${x + 10}" x2="${x + 26}" y1="${yy - 4}" y2="${yy - 4}" stroke="${c}" stroke-width="2" stroke-dasharray="4 2"/>` : `<rect x="${x + 10}" y="${yy - 10}" width="10" height="10" fill="${c}"/>`;
      s += `<text x="${x + 30}" y="${yy}" font-size="11.5">${t}</text>${val ? `<text x="${x + (tip.w || 130) - 10}" y="${yy}" font-size="11.5" text-anchor="end">${val}</text>` : ""}`;
    });
  }
  return s + "</svg>";
}

// Two-period trend lines
function trend({ w = 1340, h = 330, a, b, labels, legend }) {
  const L = 50, R = 20, T = 50, B = 40, pw = w - L - R, ph = h - T - B, max = 20;
  const y = (v) => T + ph - (v / max) * ph, x = (i) => L + (i / (a.length - 1)) * pw;
  let s = `<svg width="${w}" height="${h}">`;
  for (let i = 0; i < max; i += 4) s += `<rect x="${L}" y="${y(i + 4)}" width="${pw}" height="${ph / 5}" fill="#f6f5f3"/>`;
  for (let i = 2; i <= max; i += 2) s += `<text x="${L - 10}" y="${y(i) + 4}" font-size="11" text-anchor="end">${i}%</text><line x1="${L}" x2="${L + pw}" y1="${y(i)}" y2="${y(i)}" stroke="#e8e6e2"/>`;
  s += `<line x1="${L}" x2="${L}" y1="${T}" y2="${T + ph}" stroke="#999"/><line x1="${L}" x2="${L + pw}" y1="${T + ph}" y2="${T + ph}" stroke="#999"/>`;
  labels.forEach((l, i) => (s += `<line x1="${x(i)}" x2="${x(i)}" y1="${T + ph}" y2="${T + ph + 5}" stroke="#999"/><text x="${x(i)}" y="${T + ph + 22}" font-size="11.5" text-anchor="middle">${l}</text>`));
  s += `<path d="M${b.map((v, i) => x(i) + "," + y(v)).join("L")}" fill="none" stroke="#1f7a5c" stroke-width="3" stroke-dasharray="7 6"/>`;
  s += `<path d="M${a.map((v, i) => x(i) + "," + y(v)).join("L")}" fill="none" stroke="#f28c00" stroke-width="3"/>`;
  let lx = w - R - 430;
  s += `<line x1="${lx}" x2="${lx + 26}" y1="14" y2="14" stroke="#f28c00" stroke-width="3"/><text x="${lx + 32}" y="18" font-size="11.5">${legend[0]}</text>`;
  lx += legend[0].length * 6.4 + 60;
  s += `<line x1="${lx}" x2="${lx + 26}" y1="14" y2="14" stroke="#1f7a5c" stroke-width="3" stroke-dasharray="5 3"/><text x="${lx + 32}" y="18" font-size="11.5">${legend[1]}</text>`;
  return s + "</svg>";
}

// Generic charts used by the screens below
function axisY(L, w, y, min, max, step, unit) {
  let s = "";
  for (let v = min; v <= max + 1e-9; v += step) s += `<line x1="${L}" x2="${w}" y1="${y(v)}" y2="${y(v)}" stroke="#eee"/><text x="${L - 8}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="#777">${+v.toFixed(2)}${unit}</text>`;
  return s;
}
function lineChart({ w, h, labels, series, min = 0, max, step, unit = "", L = 48, R = 16, T = 14, B = 28, refLine }) {
  const pw = w - L - R, ph = h - T - B, x = (i) => L + (i / (labels.length - 1)) * pw, y = (v) => T + ph - ((v - min) / (max - min)) * ph;
  let s = `<svg width="${w}" height="${h}">` + axisY(L, L + pw, y, min, max, step, unit);
  labels.forEach((l, i) => (s += `<text x="${x(i)}" y="${h - 6}" font-size="11" text-anchor="middle" fill="#555">${l}</text>`));
  if (refLine) s += `<line x1="${L}" x2="${L + pw}" y1="${y(refLine.v)}" y2="${y(refLine.v)}" stroke="${refLine.color}" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${L + pw}" y="${y(refLine.v) - 6}" font-size="11" text-anchor="end" fill="${refLine.color}">${refLine.label}</text>`;
  series.forEach((sr) => {
    const d = sr.vals.map((v, i) => x(i) + "," + y(v)).join("L");
    if (sr.area) s += `<path d="M${x(0)},${y(min)}L${d}L${x(sr.vals.length - 1)},${y(min)}Z" fill="${sr.color}" opacity=".13"/>`;
    s += `<path d="M${d}" fill="none" stroke="${sr.color}" stroke-width="${sr.width || 2.5}" stroke-dasharray="${sr.dash || ""}" stroke-linejoin="round"/>`;
    if (sr.dots) sr.vals.forEach((v, i) => (s += `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#fff" stroke="${sr.color}" stroke-width="2"/>`));
  });
  return s + "</svg>";
}
// Grouped, stacked or overlapping vertical bars
function barChart({ w, h, labels, series, max, step, unit = "", mode = "group", L = 48, R = 16, T = 14, B = 28, gap = .34, values }) {
  const pw = w - L - R, ph = h - T - B, bw = pw / labels.length, y = (v) => T + ph - (v / max) * ph;
  let s = `<svg width="${w}" height="${h}">` + axisY(L, L + pw, y, 0, max, step, unit);
  labels.forEach((l, i) => {
    const inner = bw * (1 - gap), x0 = L + i * bw + (bw - inner) / 2;
    if (mode === "stack") {
      let acc = 0;
      series.forEach((sr) => { const v = sr.vals[i]; s += `<rect x="${x0}" y="${y(acc + v)}" width="${inner}" height="${y(acc) - y(acc + v)}" fill="${sr.color}" stroke="#fff" stroke-width="1"/>`; acc += v; });
    } else if (mode === "overlap") {
      const [back, front] = series;
      s += `<rect x="${x0}" y="${y(back.vals[i])}" width="${inner}" height="${T + ph - y(back.vals[i])}" fill="${back.color}"/>`;
      s += `<rect x="${x0 + inner * .22}" y="${y(front.vals[i])}" width="${inner * .56}" height="${T + ph - y(front.vals[i])}" fill="${front.color}"/>`;
    } else {
      const sw = inner / series.length;
      series.forEach((sr, k) => (s += `<rect x="${x0 + k * sw + 1}" y="${y(sr.vals[i])}" width="${sw - 2}" height="${T + ph - y(sr.vals[i])}" fill="${sr.color}" rx="1.5"/>`));
    }
    if (values) s += `<text x="${L + i * bw + bw / 2}" y="${y(values[i]) - 6}" font-size="11" text-anchor="middle" fill="#333">${values[i]}${unit}</text>`;
    s += `<text x="${L + i * bw + bw / 2}" y="${h - 6}" font-size="11" text-anchor="middle" fill="#555">${l}</text>`;
  });
  return s + "</svg>";
}
function scatter({ w, h, pts, x: [xmin, xmax, xstep, xunit], y: [ymin, ymax, ystep, yunit], xlab, ylab, L = 52, R = 20, T = 14, B = 44 }) {
  const pw = w - L - R, ph = h - T - B, sx = (v) => L + ((v - xmin) / (xmax - xmin)) * pw, sy = (v) => T + ph - ((v - ymin) / (ymax - ymin)) * ph;
  let s = `<svg width="${w}" height="${h}">` + axisY(L, L + pw, sy, ymin, ymax, ystep, yunit);
  for (let v = xmin; v <= xmax + 1e-9; v += xstep) s += `<text x="${sx(v)}" y="${T + ph + 18}" font-size="11" text-anchor="middle" fill="#777">${v}${xunit}</text>`;
  if (ymin < 0) s += `<line x1="${L}" x2="${L + pw}" y1="${sy(0)}" y2="${sy(0)}" stroke="#999"/>`;
  s += `<text x="${L + pw / 2}" y="${h - 4}" font-size="11.5" text-anchor="middle" fill="#555">${xlab}</text><text x="12" y="${T + ph / 2}" font-size="11.5" text-anchor="middle" fill="#555" transform="rotate(-90 12 ${T + ph / 2})">${ylab}</text>`;
  pts.forEach(([label, xv, yv, r, c]) => (s += `<circle cx="${sx(xv)}" cy="${sy(yv)}" r="${r}" fill="${c || "#f28c00"}" fill-opacity=".72" stroke="#fff" stroke-width="1.5"/><text x="${sx(xv) + r + 4}" y="${sy(yv) + 4}" font-size="11.5" fill="#333">${label}</text>`));
  return s + "</svg>";
}
function donutSvg(data, center, sub, size = 190, width = 30) {
  const r = size / 2 - width / 2 - 2, c = 2 * Math.PI * r, m = size / 2;
  let off = 0, s = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><g transform="rotate(-90 ${m} ${m})">`;

  return s + `</g><text x="${m}" y="${m - 2}" text-anchor="middle" font-size="24" font-weight="700">${center}</text><text x="${m}" y="${m + 18}" text-anchor="middle" font-size="11.5" fill="#666">${sub}</text></svg>`;
}

      <div class="d-chk" style="margin-top:18px"><i><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4"><path d="m4 12 5 5L20 6"/></svg></i>I accept the <u>terms and conditions</u></div>

if (builders[v]) document.getElementById(v).innerHTML = builders[v]();
// ?measure=1 writes the screen height into the DOM, read with chrome --dump-dom to size the cover iframes
if (new URLSearchParams(location.search).has("measure")) document.body.setAttribute("data-h", document.getElementById(v).offsetHeight);

/* ===================== maps ===================== */
// Region seeds (lon, lat, group). Voronoi cells clipped to the country outline stand in for regional borders.
const seeds = [[7.32, 45.74, "vda"], [7.69, 45.07, "pie"], [9.19, 45.46, "lom"], [11.12, 46.07, "taa"], [12.33, 45.44, "ven"], [13.4, 46.0, "fvg"], [8.93, 44.41, "lig"], [11.34, 44.49, "emr"], [11.25, 43.77, "tos"], [12.39, 43.11, "umb"], [13.52, 43.62, "mar"], [12.5, 41.9, "laz"], [13.9, 42.25, "abr"], [14.66, 41.56, "mol"], [14.27, 40.85, "cam"], [16.6, 41.0, "pug"], [17.9, 40.4, "pug"], [15.8, 40.5, "bas"], [16.4, 39.0, "cal"], [13.36, 37.9, "sic"], [14.9, 37.5, "sic"], [9.0, 39.5, "sar"], [8.8, 40.6, "sar"]];
const spend = { vda: .25, pie: .5, lom: .95, taa: .55, ven: .85, fvg: .35, lig: .5, emr: .6, tos: .9, umb: .3, mar: .35, laz: 1, abr: .3, mol: .1, cam: .75, pug: .6, bas: .15, cal: .3, sic: .65, sar: .55 };
const cities = [["Torino", 7.69, 45.07], ["Milano", 9.19, 45.46], ["Genova", 8.93, 44.41], ["Venezia", 12.33, 45.44], ["Trieste", 13.77, 45.65], ["Parma", 10.33, 44.8], ["Livorno", 10.31, 43.55], ["Pesaro", 12.91, 43.91], ["Roma", 12.5, 41.9], ["Napoli", 14.27, 40.85], ["Matera", 16.6, 40.67], ["Lecce", 18.17, 40.35], ["Nuoro", 9.33, 40.32], ["Palermo", 13.36, 38.12]];

async function drawMaps() {
  const svgs = document.querySelectorAll("svg[data-map]");
  if (!svgs.length) return;
  const world = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json").then((r) => r.json());
  const countries = topojson.feature(world, world.objects.countries).features;
  const italy = countries.find((f) => f.id === "380");
  const heat = d3.scaleLinear().domain([0, .5, .8, 1]).range(["#fde9cc", "#f6b04f", "#f28c00", "#c2410c"]);

  svgs.forEach((el, n) => {
    const kind = el.dataset.map, w = +el.getAttribute("width"), h = +el.getAttribute("height");
    const svg = d3.select(el);
    let proj;
    if (kind === "world") {
      // Choropleth of approval rate by country, fictional values derived from the country id
      const land = countries.filter((f) => f.id !== "010");
      const wp = d3.geoNaturalEarth1().fitExtent([[0, 0], [w, h]], { type: "FeatureCollection", features: land });
      const rate = (id) => 80 + ((+id * 37) % 19);
      svg.append("g").selectAll("path").data(land).join("path").attr("d", d3.geoPath(wp))
        .attr("fill", (f) => (+f.id % 5 === 0 ? "#e6e4df" : heat((rate(f.id) - 80) / 18))).attr("stroke", "#fff").attr("stroke-width", .5);
      return;
    }
    if (kind === "italy") proj = d3.geoMercator().fitExtent([[6, 6], [w - 6, h - 6]], italy);
    else {
      proj = d3.geoMercator().scale(1750).center([12.6, 42.1]).translate([w * 0.6, 250]);
      if (kind === "strip") { const yy = proj([9, 45.25])[1]; el.setAttribute("viewBox", `0 ${yy - 50} 1440 100`); }
    }
    const path = d3.geoPath(proj);
    if (kind !== "italy") {
      svg.append("rect").attr("x", -10).attr("y", -10).attr("width", w + 20).attr("height", 600).attr("fill", "#f6f5f2");
      svg.append("g").selectAll("path").data(countries.filter((f) => f.id !== "380")).join("path").attr("d", path).attr("fill", "#ecebe7").attr("stroke", "#c9c7c2").attr("stroke-width", .8);
    }
    const clipId = "clip-" + n;
    svg.append("clipPath").attr("id", clipId).append("path").attr("d", path(italy));
    svg.append("path").attr("d", path(italy)).attr("fill", "#cbc8c2");
    const pts = seeds.map((s) => proj([s[0], s[1]]));
    const vor = d3.Delaunay.from(pts).voronoi([-500, -500, w + 500, h + 1000]);
    const g = svg.append("g").attr("clip-path", `url(#${clipId})`);
    seeds.forEach((s, i) => {
      const fill = kind === "italy" ? heat(spend[s[2]]) : s[2] === "lom" ? "#f28c00" : "#cbc8c2";
      g.append("path").attr("d", vor.renderCell(i)).attr("fill", fill).attr("stroke", fill).attr("stroke-width", 1.2);
    });
    // borders between different regions only
    const groups = seeds.map((s) => s[2]);
    for (const [i, j] of (function* () { for (let i = 0; i < seeds.length; i++) for (const j of vor.neighbors(i)) if (j > i) yield [i, j]; })()) {
      if (groups[i] === groups[j]) continue;
      const a = vor.cellPolygon(i), b = vor.cellPolygon(j);
      const shared = a.filter((p) => b.some((q) => Math.hypot(p[0] - q[0], p[1] - q[1]) < .01));
      if (shared.length >= 2) g.append("line").attr("x1", shared[0][0]).attr("y1", shared[0][1]).attr("x2", shared[1][0]).attr("y2", shared[1][1]).attr("stroke", "#fff").attr("stroke-width", kind === "italy" ? 1.2 : 1);
    }
    svg.append("path").attr("d", path(italy)).attr("fill", "none").attr("stroke", kind === "italy" ? "#fff" : "#b9b6b0").attr("stroke-width", .8);
    if (kind !== "italy") {
      cities.forEach(([t, lon, lat]) => {
        const [x, y] = proj([lon, lat]);
        svg.append("circle").attr("cx", x).attr("cy", y).attr("r", 2.2).attr("fill", "#141413");
        svg.append("text").attr("x", x + 5).attr("y", y - 3).attr("font-size", 9.5).attr("font-weight", 600).text(t);
      });
      const [mx, my] = proj([9.19, 45.46]);
      svg.append("circle").attr("cx", mx).attr("cy", my).attr("r", 20).attr("fill", "rgba(248,197,128,.35)").attr("stroke", "#141413").attr("stroke-width", 1.4);
    }
  });
}
drawMaps();

/* ===================== isometric covers ===================== */
// Each cover shows the rebuilt screens in tilted iframes, arranged in staggered columns.
const H = { "screen-overview": 2429, "screen-origins": 2076, "screen-categories": 1651, "screen-comparison": 2002, "screen-compare-empty": 1022, "screen-login-tourism": 900, "screen-domestic": 1100, "screen-domestic-trends": 1100, "screen-domestic-origins": 1100, "screen-domestic-industries": 1100, "screen-domestic-comparison": 1100, "screen-admin": 1000, "screen-glossary": 1100, "screen-merchant": 1250, "screen-merchant-geography": 1250, "screen-merchant-benchmark": 1250, "screen-fraud": 1250, "screen-performance": 1250, "screen-issuers": 1250, "screen-settings": 1250, "screen-login-merchant": 900 };
// Every visible slot of a cover gets a different screen: no screen appears twice in the same image.
// The pool alternates the three products so neighbours rarely come from the same dashboard.
const pool = ["screen-overview", "screen-merchant", "screen-domestic-origins", "screen-fraud", "screen-categories", "screen-domestic", "screen-merchant-geography", "screen-login-tourism", "screen-domestic-industries", "screen-performance", "screen-comparison", "screen-admin", "screen-merchant-benchmark", "screen-domestic-trends", "screen-issuers", "screen-origins", "screen-glossary", "screen-settings", "screen-domestic-comparison", "screen-login-merchant", "screen-compare-empty"];
// Stage local axes after rotateZ(-38deg) rotateX(52deg): columns run up-right, screens stack down-right.
// x/y place the grid so it covers the canvas; area is the part of the canvas where screens can be seen.
const iso = {
  hero: { x: -1406, y: 444, s: .42, cols: 9, len: 9500, area: [1150, 0, 2400, 1200], start: 0 },
  card: { x: -1134, y: 809, s: .36, cols: 6, len: 7800, area: [0, 330, 1200, 1500], start: 3 },
  showcase: { x: -2600, y: 1300, s: .5, cols: 12, len: 16000, area: [0, 0, 2400, 1350], start: 0 },
};
const COS = Math.cos((38 * Math.PI) / 180), SIN = Math.sin((38 * Math.PI) / 180), TILT = Math.cos((52 * Math.PI) / 180);
const stage = document.querySelector(`#${v} .stage[data-iso]`);
if (stage) {
  const cfg = iso[stage.dataset.iso], gap = 90, [ax0, ay0, ax1, ay1] = cfg.area;
  const project = (X, Y) => [cfg.x + cfg.s * (X * COS + Y * SIN), cfg.y + cfg.s * TILT * (-X * SIN + Y * COS)];
  const visible = (X, Y, h) => {
    for (let i = 0; i <= 12; i++) for (let j = 0; j <= 12; j++) {
      const [px, py] = project(X + (1440 * i) / 12, Y + (h * j) / 12);
      if (px > ax0 - 4 && px < ax1 + 4 && py > ay0 - 4 && py < ay1 + 4) return true;
    }
    return false;
  };
  const order = [...pool.slice(cfg.start), ...pool.slice(0, cfg.start)];
  let k = 0, overflow = 0;
  stage.style.left = cfg.x + "px"; stage.style.top = cfg.y + "px";
  stage.style.transform = `scale(${cfg.s}) rotateX(52deg) rotateZ(-38deg)`;
  for (let c = 0; c < cfg.cols; c++) {
    let y = -((c * 737) % 1600);
    const X = c * (1440 + gap);
    while (y < cfg.len) {
      const id = order[k % order.length], h = H[id];
      if (visible(X, y, h)) {
        if (k >= order.length) overflow++;
        else {
          const f = document.createElement("iframe");
          f.className = "shot"; f.src = `?v=${id}`;
          Object.assign(f.style, { left: X + "px", top: y + "px", width: "1440px", height: h + "px" });
          stage.appendChild(f);
        }
        k++;
      }
      y += h + gap;
    }
  }
  // Read with --dump-dom: slots used, and slots left empty because the pool ran out
  document.body.dataset.slots = k; document.body.dataset.overflow = overflow;
}
