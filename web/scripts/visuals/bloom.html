<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Bloom: anonymized rebuild of a white-label employee engagement platform (web, iOS, Android, HR admin).
     Fictional product name, workspaces, people, content and data. No client marks, no photos of people.
     Views: one <section id> per screen or cover, picked with ?v=<id>. ?z=2 zooms a view for crisp phone renders. -->
<link href="https://fonts.googleapis.com/css2?family=Sen:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=block" rel="stylesheet">
<style>
  :root {
    /* identity */
    --or: #f08328; --ye: #fab32d; --te: #199cba; --sk: #8ac9e4; --mi: #96cfc3; --pk: #e8708a;
    --cream: #fff4e6; --deep: #12343f; --leaf: #4f9a6a; --leaf-d: #2f7550;
    /* product */
    --ink: #1e2a32; --mut: #75818b; --bg: #f2f6f9; --line: #e4eaef; --ok: #2fa66a; --warn: #f0a528; --bad: #e0504a;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: #fff; }
  .view { display: none; position: relative; overflow: hidden; }
  .view.on { display: block; }
  .abs { position: absolute; }
  svg { display: block; }
  svg text { font-family: "Sen", sans-serif; }

  /* ================= product screens ================= */
  .scr { --p: #199cba; font-family: "Sen", sans-serif; color: var(--ink); background: var(--bg); width: 1440px; height: 900px; overflow: hidden; position: relative; font-size: 15px; }
  .scr.m { width: 390px; height: 844px; font-size: 13px; }
  .pl { background: color-mix(in srgb, var(--p) 11%, #fff); }
  .tp { color: var(--p); }
  .bp { background: var(--p); color: #fff; }
  .nav { height: 76px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 48px; gap: 36px; }
  .search { display: flex; align-items: center; gap: 10px; height: 42px; width: 380px; border-radius: 21px; background: var(--bg); color: #9aa5ad; padding: 0 16px; font-size: 14px; }
  .navi { display: flex; gap: 6px; margin-left: auto; }
  .navi div { width: 74px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--mut); padding: 8px 0; border-radius: 10px; position: relative; }
  .navi div.on { color: var(--p); background: color-mix(in srgb, var(--p) 10%, #fff); font-weight: 700; }
  .navi .dot { position: absolute; top: 4px; right: 18px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
  .main { padding: 30px 56px; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 4px 14px rgba(20, 45, 65, .07); padding: 22px 24px; }
  .h1 { font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
  .h2 { font-size: 20px; font-weight: 700; }
  .h3 { font-size: 16px; font-weight: 700; }
  .mut { color: var(--mut); }
  .sm { font-size: 13px; }
  .xs { font-size: 12px; }
  .row { display: flex; align-items: center; }
  .col { display: flex; flex-direction: column; }
  .sb { justify-content: space-between; }
  .g4 { gap: 4px; } .g6 { gap: 6px; } .g8 { gap: 8px; } .g10 { gap: 10px; } .g12 { gap: 12px; } .g16 { gap: 16px; } .g20 { gap: 20px; } .g24 { gap: 24px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--p); color: var(--p); font-weight: 700; font-size: 13px; background: #fff; white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 10px; background: var(--p); color: #fff; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .btn.r { border-radius: 999px; }
  .btn.o { background: #fff; color: var(--p); box-shadow: inset 0 0 0 1.5px var(--p); }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: color-mix(in srgb, var(--p) 12%, #fff); color: var(--p); white-space: nowrap; }
  .chip.ok { background: #e3f5ec; color: var(--ok); } .chip.warn { background: #fdf1dc; color: #c27c0e; } .chip.bad { background: #fbe5e4; color: var(--bad); } .chip.grey { background: #eef1f4; color: var(--mut); }
  .bar { height: 8px; border-radius: 99px; background: #e8edf1; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: var(--p); }
  .av { border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; flex: none; }
  .tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--line); }
  .tabs div { padding: 0 2px 12px; color: var(--mut); font-weight: 600; font-size: 14px; }
  .tabs div.on { color: var(--p); box-shadow: inset 0 -3px 0 var(--p); }
  .seg { display: inline-flex; background: #fff; border-radius: 999px; padding: 4px; box-shadow: inset 0 0 0 1px var(--line); }
  .seg span { padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--mut); }
  .seg span.on { background: var(--p); color: #fff; }
  .hr { height: 1px; background: var(--line); }
  .input { height: 42px; border-radius: 10px; border: 1px solid var(--line); background: #fff; display: flex; align-items: center; padding: 0 14px; color: #9aa5ad; font-size: 14px; }
  .ta { border-radius: 10px; border: 1px solid var(--line); background: #fff; padding: 12px 14px; color: var(--ink); font-size: 14px; line-height: 1.45; }
  .lbl { font-size: 12px; font-weight: 700; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; }
  .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c3ccd3; flex: none; }
  .radio.on { border-color: var(--p); box-shadow: inset 0 0 0 4px #fff; background: var(--p); }
  .check { width: 18px; height: 18px; border-radius: 5px; border: 2px solid #c3ccd3; flex: none; display: grid; place-items: center; }
  .check.on { background: var(--p); border-color: var(--p); color: #fff; }
  .tog { width: 40px; height: 24px; border-radius: 12px; background: #d6dde3; position: relative; flex: none; }
  .tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .tog.on { background: var(--p); } .tog.on::after { left: 19px; }
  .strip { border-left: 12px solid var(--p); border-radius: 22px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  .t th { text-align: left; font-size: 12px; color: var(--mut); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .t td { padding: 11px 12px; border-bottom: 1px solid #eef2f5; white-space: nowrap; }
  .hex { width: 46px; height: 52px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); display: grid; place-items: center; color: #fff; flex: none; }
  .stat .n { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .reac { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: #f1f4f7; font-size: 13px; font-weight: 700; color: #5b6770; }
  .reac.on { background: color-mix(in srgb, var(--p) 12%, #fff); color: var(--p); }

  /* admin shell */
  .adm { display: grid; grid-template-columns: 236px 1fr; height: 100%; }
  .side { background: #fff; border-right: 1px solid var(--line); padding: 26px 18px; display: flex; flex-direction: column; gap: 4px; }
  .side .it { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 14px; border-radius: 10px; color: #56636c; font-size: 14px; font-weight: 600; }
  .side .it.on { background: color-mix(in srgb, var(--p) 11%, #fff); color: var(--p); }
  .side .grp { font-size: 11px; font-weight: 700; color: #a4afb7; letter-spacing: .1em; text-transform: uppercase; padding: 18px 14px 6px; }
  .amain { padding: 28px 40px; overflow: hidden; }

  /* mobile */
  .sbar { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 6px 28px 0; font-weight: 700; font-size: 14px; }
  .mhead { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
  .mbody { padding: 6px 18px; }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: var(--p); border-radius: 26px 26px 0 0; display: flex; justify-content: space-around; padding: 14px 10px 0; color: rgba(255,255,255,.72); }
  .tabbar div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; width: 64px; }
  .tabbar div.on { color: #fff; }
  .tabbar div.on svg { background: rgba(255,255,255,.2); border-radius: 12px; padding: 4px; width: 34px; height: 30px; }
  .home-ind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: rgba(255,255,255,.85); }

  /* ================= identity ================= */
  .title { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; color: var(--deep); letter-spacing: -.045em; line-height: .8; white-space: nowrap; }
  .title .o { position: relative; display: inline-block; z-index: 0; }
  .payoff { font-family: "Bricolage Grotesque", sans-serif; font-weight: 500; color: #4c6670; letter-spacing: -.01em; }
  .stage { position: absolute; perspective: 2600px; }
  .dev { position: absolute; transform-style: preserve-3d; }
  .phone { position: absolute; background: #14181c; border-radius: 64px; padding: 15px; box-shadow: 0 60px 90px rgba(18, 52, 63, .28), 0 0 0 2px #2b3238 inset; }
  .phone iframe { display: block; width: 390px; height: 844px; border: 0; border-radius: 50px; background: #fff; }
  .tablet { position: absolute; background: #14181c; border-radius: 46px; padding: 30px; box-shadow: 0 70px 110px rgba(18, 52, 63, .26), 0 0 0 2px #2b3238 inset; }
  .tablet iframe { display: block; width: 1440px; height: 900px; border: 0; border-radius: 16px; background: #fff; }
  .shot { position: absolute; border: 0; border-radius: 14px; background: #fff; box-shadow: 0 40px 80px rgba(18, 52, 63, .22); }
</style>

function smooth(pts) {

/* ===================== identity: flowers ===================== */
const FL = ["#f08328", "#fab32d", "#199cba", "#8ac9e4", "#96cfc3", "#e8708a"];
// A flat flower head: n petals around a centre
function flower(x, y, r, n, col, center = "#12343f", rot = 0, op = 1) {
  let s = `<g transform="translate(${x} ${y}) rotate(${rot})" opacity="${op}">`;
  for (let i = 0; i < n; i++) s += `<ellipse cx="0" cy="${-r * .52}" rx="${r * (n > 6 ? .2 : .32)}" ry="${r * .52}" fill="${col}" transform="rotate(${(360 / n) * i})"/>`;
  return s + `<circle r="${r * .26}" fill="${center}"/></g>`;
}
function leaf(x, y, len, ang, col) {
  return `<path d="M0 0C${len * .3} ${-len * .28} ${len * .75} ${-len * .25} ${len} 0C${len * .75} ${len * .22} ${len * .3} ${len * .25} 0 0Z" fill="${col}" transform="translate(${x} ${y}) rotate(${ang})"/>`;
}
function stem(x, base, top, col, r, n, rr) {
  const bend = (rr() - .5) * 60;
  let s = `<path d="M${x} ${base} C${x} ${base - (base - top) * .4} ${x + bend} ${top + (base - top) * .4} ${x + bend * .6} ${top}" stroke="#2f7550" stroke-width="${Math.max(5, r * .09)}" fill="none" stroke-linecap="round"/>`;
  const ly = top + (base - top) * (.45 + rr() * .25), lx = x + bend * .4;
  s += leaf(lx, ly, r * .9, -30 - rr() * 20, "#4f9a6a") + leaf(lx, ly + r * .5, r * .8, 200 + rr() * 20, "#5fae7a");
  return s + flower(x + bend * .6, top, r, n, col, "#12343f", rr() * 60);
}
function drawGardens() {
  document.querySelectorAll(`#${v} svg.garden`).forEach((svg) => {
    const k = svg.dataset.kind, W = +svg.getAttribute("width"), H = +svg.getAttribute("height"), rr = rng(k.length * 97 + 5);
    let s = "";
    if (k === "hero") {
      s += `<circle cx="1820" cy="560" r="560" fill="#ffe7cc"/><circle cx="2250" cy="180" r="260" fill="#d9f0ec"/><circle cx="1240" cy="1180" r="300" fill="#dff0f7"/>`;
      // a rising row of flowers, like a bar chart that blooms
      [[1240, 900, 70, 6, FL[2]], [1350, 820, 60, 8, FL[1]], [1470, 760, 80, 5, FL[0]], [2240, 520, 92, 6, FL[5]], [2330, 640, 70, 8, FL[4]], [2120, 860, 64, 5, FL[3]]].forEach(([x, top, r, n, c]) => { s += stem(x, H + 20, top, c, r, n, rr); });
      for (let i = 0; i < 26; i++) { const x = 60 + rr() * 1060, y = 60 + rr() * 1080; if (y > 280 && y < 720 && x < 1150) continue; s += flower(x, y, 10 + rr() * 22, [5, 6, 8][i % 3], FL[i % FL.length], "#12343f", rr() * 90, .9); }
    } else if (k === "card") {
      s += `<circle cx="600" cy="1340" r="560" fill="#ffe7cc"/><circle cx="1120" cy="80" r="230" fill="#d9f0ec"/><circle cx="60" cy="500" r="200" fill="#dff0f7"/>`;
      [[60, 1150, 80, 6, FL[0]], [170, 1290, 60, 8, FL[1]], [1140, 1120, 84, 5, FL[2]], [1040, 1300, 62, 6, FL[5]]].forEach(([x, top, r, n, c]) => { s += stem(x, H + 20, top, c, r, n, rr); });
      for (let i = 0; i < 14; i++) { const x = 40 + rr() * 1120, y = 40 + rr() * 520; if (y > 110 && y < 470 && x > 120 && x < 1080) continue; s += flower(x, y, 12 + rr() * 22, [5, 6, 8][i % 3], FL[i % FL.length], "#12343f", rr() * 90, .9); }
    } else if (k === "petals") {
      for (let i = 0; i < 60; i++) s += flower(rr() * W, rr() * H, 14 + rr() * 40, [5, 6, 8][i % 3], FL[i % FL.length], "#12343f", rr() * 90, .55);
    } else if (k === "soft") {
      s += `<circle cx="1900" cy="700" r="620" fill="#ffe7cc"/><circle cx="380" cy="1300" r="420" fill="#d9f0ec"/>`;
      for (let i = 0; i < 24; i++) { const x = rr() * W, y = rr() * H; s += flower(x, y, 12 + rr() * 26, [5, 6, 8][i % 3], FL[i % FL.length], "#12343f", rr() * 90, .7); }
    }
    svg.innerHTML = s;
  });
}
// The two o's of the title open into flowers
function drawTitles() {
  document.querySelectorAll(`#${v} .title`).forEach((el) => {
    const size = +el.dataset.size;
    el.style.fontSize = size + "px";
    el.innerHTML = [...el.textContent].map((ch) => ch === "o" ? `<span class="o">o</span>` : ch).join("");
    el.querySelectorAll(".o").forEach((o, i) => {
      const b = o.getBoundingClientRect(), r = b.width * .78, cols = [["#f08328", "#fab32d"], ["#199cba", "#96cfc3"]][i % 2];
      o.style.color = cols[0];
      const svg = `<svg style="position:absolute;left:50%;top:${size * .5}px;transform:translate(-50%,-50%);z-index:-1;overflow:visible" width="10" height="10">${[0, 1, 2, 3, 4, 5, 6, 7].map((k) => `<ellipse cx="0" cy="${-r * .74}" rx="${r * .17}" ry="${r * .3}" fill="${cols[1]}" transform="rotate(${k * 45 + 22.5})"/>`).join("")}</svg>`;
      o.insertAdjacentHTML("afterbegin", svg);
    });
  });
}
function loadDevices() {
  document.querySelectorAll(`#${v} iframe[data-src]`).forEach((f) => { f.src = `?v=${f.dataset.src}`; });
}
// Showcase: isometric grid of desktop screens, each used once; slots that would show only a sliver are dropped
function buildGrid() {
  const host = document.querySelector(`#${v} .grid3d`);
  if (!host) return;
  const ids = ["a-analytics", "d-home", "a-voice", "d-growth", "a-performance", "d-feed", "a-home", "d-checkpoints", "a-people", "d-okr", "a-review", "d-voice", "a-badges", "d-wiki-ai", "a-survey", "d-rewards", "a-reviews", "d-wiki", "s-workspace", "d-login"];
  const SW = 1440, SH = 900, gap = 90, cols = 8, rows = 7;
  const box = host.getBoundingClientRect();
  const inner = document.createElement("div");
  host.appendChild(inner);
  const layout = (s) => {
    inner.innerHTML = "";
    Object.assign(inner.style, { position: "absolute", left: "0px", top: "0px", transformOrigin: "0 0", transform: `translate(${box.width * .5}px, ${box.height * .5}px) scale(${s}) rotateX(52deg) rotateZ(-38deg) translate(${-cols * (SW + gap) / 2}px, ${-rows * (SH + gap) / 2}px)` });
    const slots = [];
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      const d = document.createElement("div");
      Object.assign(d.style, { position: "absolute", left: c * (SW + gap) + "px", top: r * (SH + gap) + (c % 2) * 380 + "px", width: SW + "px", height: SH + "px" });
      inner.appendChild(d);
      const b = d.getBoundingClientRect();
      const vw = Math.max(0, Math.min(b.right, box.right) - Math.max(b.left, box.left)), vh = Math.max(0, Math.min(b.bottom, box.bottom) - Math.max(b.top, box.top));
      slots.push([d, (vw * vh) / (b.width * b.height), Math.hypot(b.left + b.width / 2 - box.left - box.width / 2, b.top + b.height / 2 - box.top - box.height / 2)]);
    }
    return slots;
  };
  let s = .3, slots;
  for (; s < 1; s += .02) { slots = layout(s); if (slots.filter(([, f]) => f > .3).length <= ids.length) break; }
  slots.sort((a, b) => a[2] - b[2]);
  let k = 0;
  slots.forEach(([d, f]) => {
    if (f <= .3 || k >= ids.length) return d.remove();
    const fr = document.createElement("iframe");
    fr.className = "shot"; fr.src = `?v=${ids[k++]}`;
    Object.assign(fr.style, { left: d.style.left, top: d.style.top, width: SW + "px", height: SH + "px" });
    d.replaceWith(fr);
  });
  document.body.setAttribute("data-slots", k);
}

const run = async () => {
  // load every face up front: text built later would otherwise stay invisible (display=block) when the render ends
  await Promise.all(["400", "600", "700", "800"].map((w) => document.fonts.load(`${w} 16px Sen`)).concat(["500", "800"].map((w) => document.fonts.load(`${w} 16px "Bricolage Grotesque"`))));
  await document.fonts.ready;
  const el = document.getElementById(v);
  if (builders[v]) el.innerHTML = builders[v]();
  if (builders[v]) Object.assign(el.style, v.startsWith("m-") ? { width: "390px", height: "844px" } : { width: "1440px", height: "900px" });
  drawGardens();
  drawTitles();
  loadDevices();
  buildGrid();
};
run();
