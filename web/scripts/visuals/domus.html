<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Domus: anonymized rebuild of an all-in-one hospitality platform (guest app, smart TV homepage, front desk panel).
     Fictional product name, properties, suites, guests, staff, channels and data. No client marks, no photos.
     Views: one <section id> per screen or cover, picked with ?v=<id>. ?z=2 zooms a view for crisp phone renders. -->
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&display=block" rel="stylesheet">
<style>
  :root {
    /* identity */
    --terra: #d4553f; --terra-l: #ec8a72; --blush: #f4d8cc; --cream: #f5efe5; --sand: #e8dccb; --linen: #fbf7f1;
    --ox: #5b2420; --ox-d: #3a1714; --walnut: #9b6a45; --olive: #858a5f;
    /* product */
    --ink: #2f3236; --mut: #8a8580; --line: #e6ddd0; --ok: #5f8f5a; --warn: #c98a2b; --bad: #c4473a;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: #fff; }
  .view { display: none; position: relative; overflow: hidden; }
  .view.on { display: block; }
  .abs { position: absolute; }
  svg { display: block; }

  /* ================= product screens ================= */
  .scr { font-family: "Jost", sans-serif; color: var(--ink); background: var(--cream); width: 1440px; height: 900px; overflow: hidden; position: relative; font-size: 15px; }
  .scr.m { width: 390px; height: 844px; font-size: 13px; }
  .scr.tv { width: 1920px; height: 1080px; font-size: 26px; color: #fff; background: var(--ox-d); }
  .serif { font-family: "Bodoni Moda", serif; font-weight: 400; letter-spacing: -.01em; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(91, 36, 32, .06); padding: 20px 22px; }
  .h1 { font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
  .h2 { font-size: 20px; font-weight: 600; }
  .h3 { font-size: 16px; font-weight: 600; }
  .mut { color: var(--mut); }
  .tp { color: var(--terra); }
  .sm { font-size: 13px; } .xs { font-size: 12px; }
  .row { display: flex; align-items: center; }
  .col { display: flex; flex-direction: column; }
  .sb { justify-content: space-between; }
  .g4 { gap: 4px; } .g6 { gap: 6px; } .g8 { gap: 8px; } .g10 { gap: 10px; } .g12 { gap: 12px; } .g16 { gap: 16px; } .g20 { gap: 20px; } .g24 { gap: 24px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 20px; border-radius: 999px; background: var(--terra); color: #fff; font-weight: 600; font-size: 14px; white-space: nowrap; letter-spacing: .02em; }
  .btn.o { background: transparent; color: var(--terra); box-shadow: inset 0 0 0 1.5px var(--terra); }
  .btn.d { background: var(--ox); }
  .btn.sq { border-radius: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--blush); color: var(--ox); white-space: nowrap; }
  .chip.on { background: var(--terra); color: #fff; }
  .chip.ok { background: #e6efe2; color: var(--ok); } .chip.warn { background: #f8ecd6; color: #a46c17; } .chip.bad { background: #f6e0dc; color: var(--bad); } .chip.grey { background: #efe9e1; color: var(--mut); }
  .av { border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; flex: none; }
  .hr { height: 1px; background: var(--line); }
  .input { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: #fff; display: flex; align-items: center; padding: 0 14px; color: var(--ink); font-size: 14px; gap: 10px; }
  .input.ph { color: #b3aca4; }
  .ta { border-radius: 10px; border: 1px solid var(--line); background: #fff; padding: 12px 14px; color: var(--ink); font-size: 14px; line-height: 1.5; }
  .lbl { font-size: 11.5px; font-weight: 600; color: var(--mut); text-transform: uppercase; letter-spacing: .1em; }
  .tog { width: 46px; height: 28px; border-radius: 14px; background: #ddd4c8; position: relative; flex: none; }
  .tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .tog.on { background: var(--terra); } .tog.on::after { left: 21px; }
  .tog.s { width: 38px; height: 22px; } .tog.s::after { width: 16px; height: 16px; } .tog.s.on::after { left: 19px; }
  .check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #cdc3b6; flex: none; display: grid; place-items: center; background: #fff; }
  .check.on { background: var(--terra); border-color: var(--terra); color: #fff; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  .t th { text-align: left; font-size: 11.5px; color: var(--mut); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .t td { padding: 12px 12px; border-bottom: 1px solid #f0e9df; white-space: nowrap; }
  .fld { flex: 1 1 0; min-width: 0; } .col > .fld { flex: none; }
  .ill { border-radius: 14px; overflow: hidden; flex: none; }
  .ill svg { width: 100%; height: 100%; }

  /* front desk shell */
  .adm { display: grid; grid-template-columns: 248px 1fr; height: 100%; }
  .side { background: var(--ox); color: rgba(255,255,255,.72); padding: 28px 18px; display: flex; flex-direction: column; gap: 3px; }
  .side .it { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 14px; border-radius: 10px; font-size: 14.5px; font-weight: 500; }
  .side .it.on { background: rgba(255,255,255,.12); color: #fff; }
  .side .sub { padding-left: 46px; height: 34px; font-size: 13.5px; }
  .side .sub.on { background: none; color: #fff; box-shadow: inset 2px 0 0 var(--terra-l); border-radius: 0; }
  .side .grp { font-size: 11px; font-weight: 600; color: rgba(255,255,255,.4); letter-spacing: .14em; text-transform: uppercase; padding: 18px 14px 6px; }
  .amain { padding: 26px 40px; overflow: hidden; }
  .top { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
  .omni { display: flex; align-items: center; gap: 10px; height: 44px; width: 420px; border-radius: 22px; background: #fff; color: #b3aca4; padding: 0 18px; font-size: 14px; box-shadow: inset 0 0 0 1px var(--line); }
  .sel { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: 22px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; font-weight: 500; }
  .ttl { font-size: 32px; font-family: "Bodoni Moda", serif; font-weight: 400; letter-spacing: -.01em; color: var(--ox); }

  /* mobile */
  .sbar { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 6px 28px 0; font-weight: 600; font-size: 14px; }
  .mhead { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
  .mbody { padding: 4px 20px; }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #fff; border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 12px 8px 0; color: #a59d94; }
  .tabbar div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 600; width: 66px; letter-spacing: .02em; }
  .tabbar div.on { color: var(--terra); }
  .home-ind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); }
  .segm { display: flex; background: #fff; border-radius: 999px; padding: 4px; box-shadow: inset 0 0 0 1px var(--line); }
  .segm span { flex: 1; text-align: center; padding: 9px 0; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--mut); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .segm span.on { background: var(--terra); color: #fff; }

  /* tv */
  .tvbox { border-radius: 18px; overflow: hidden; background: rgba(255,255,255,.08); flex: none; position: relative; }
  .tvbox.f { box-shadow: 0 0 0 5px var(--terra-l), 0 22px 50px rgba(0,0,0,.5); transform: scale(1.06); }
  .tvt { font-size: 21px; color: rgba(255,255,255,.82); margin-top: 14px; }
  .tvlbl { font-size: 22px; letter-spacing: .24em; font-weight: 500; color: var(--terra-l); margin-bottom: 18px; }

  /* ================= identity ================= */
  .title { font-family: "Bodoni Moda", serif; font-weight: 400; font-optical-sizing: none; font-variation-settings: "opsz" 26; color: var(--terra); letter-spacing: -.035em; line-height: .8; white-space: nowrap; }
  .payoff { font-family: "Jost", sans-serif; font-weight: 400; color: var(--ox); letter-spacing: .3em; text-transform: uppercase; }
  .stage { position: absolute; perspective: 2800px; }
  .dev { position: absolute; transform-style: preserve-3d; }
  .phone { position: absolute; background: #1b1716; border-radius: 64px; padding: 15px; box-shadow: 0 60px 90px rgba(58, 23, 20, .30), 0 0 0 2px #3a3230 inset; }
  .phone iframe { display: block; width: 390px; height: 844px; border: 0; border-radius: 50px; background: #fff; }
  .tvset { position: absolute; background: #121010; border-radius: 14px; padding: 14px; box-shadow: 0 70px 120px rgba(58, 23, 20, .34), 0 0 0 2px #2a2422 inset; }
  .tvset iframe { display: block; width: 1920px; height: 1080px; border: 0; background: #000; }
  .monitor { position: absolute; }
  .monitor .bz { background: #1b1716; border-radius: 22px 22px 0 0; padding: 22px 22px 0; box-shadow: 0 0 0 2px #3a3230 inset; }
  .monitor iframe { display: block; width: 1440px; height: 900px; border: 0; background: #fff; }
  .monitor .chin { height: 70px; background: linear-gradient(#e9e3db, #d6cfc6); border-radius: 0 0 22px 22px; }
  .monitor .neck { width: 260px; height: 190px; margin: 0 auto; background: linear-gradient(90deg, #c9c2b8, #ebe6df 50%, #c9c2b8); clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%); }
  .monitor .foot { width: 560px; height: 26px; margin: 0 auto; border-radius: 6px 6px 14px 14px; background: linear-gradient(#e6e0d8, #bfb8ae); }
  .monitor { filter: drop-shadow(0 60px 70px rgba(58, 23, 20, .28)); }
  .shot { position: absolute; border: 0; border-radius: 14px; background: #fff; box-shadow: 0 40px 80px rgba(58, 23, 20, .22); }
</style>
</head>

// A QR-like pattern (decorative, not encoding anything)
function qr(size, seed = 3) {
  const n = 29, c = size / n, r = rng(seed);
  let s = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" fill="#fff"/>`;
  const finder = (x, y) => `<rect x="${x * c}" y="${y * c}" width="${7 * c}" height="${7 * c}" fill="#1b1716"/><rect x="${(x + 1) * c}" y="${(y + 1) * c}" width="${5 * c}" height="${5 * c}" fill="#fff"/><rect x="${(x + 2) * c}" y="${(y + 2) * c}" width="${3 * c}" height="${3 * c}" fill="#1b1716"/>`;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    if ((i < 8 && j < 8) || (i > n - 9 && j < 8) || (i < 8 && j > n - 9)) continue;
    if (r() < .48) s += `<rect x="${i * c}" y="${j * c}" width="${c + .3}" height="${c + .3}" fill="#1b1716"/>`;
  }
  return s + finder(0, 0) + finder(n - 7, 0) + finder(0, n - 7) + "</svg>";
}

  "tv-login": () => `<div class="scr tv" style="background:radial-gradient(circle at 50% 40%,#5b2420,#2a100e 70%)"><svg class="abs" style="left:560px;top:120px;opacity:.16" width="800" height="960" viewBox="0 0 800 960"><path d="M60 960V400a340 340 0 0 1 680 0v560" fill="none" stroke="#ec8a72" stroke-width="30"/></svg>

/* ===================== identity: arches ===================== */
// A round-headed arch from its base centre, width and height
const arch = (cx, base, w, h, attrs) => `<path d="M${cx - w / 2} ${base}V${base - h + w / 2}a${w / 2} ${w / 2} 0 0 1 ${w} 0V${base}" ${attrs}/>`;
function drawArches() {
  document.querySelectorAll(`#${v} svg.arches`).forEach((svg) => {
    const k = svg.dataset.kind, W = +svg.getAttribute("width"), H = +svg.getAttribute("height");
    let s = "";
    if (k === "hero") {
      // an enfilade of doorways receding behind the devices
      s += `<rect x="0" y="${H - 150}" width="${W}" height="150" fill="#ebe0d1"/>`;
      s += arch(1760, H - 150, 1180, 1120, `fill="#f0dccd"`);
      [[1760, 1180, 1120], [1760, 980, 960], [1760, 800, 800], [1760, 640, 650], [1760, 500, 520]].forEach(([cx, w, h], i) => { s += arch(cx, H - 150 - i * 34, w, h, `fill="${["#f0dccd", "#ecd0c0", "#e7c3b2", "#e2b6a4", "#dda996"][i]}" stroke="#d4553f" stroke-opacity="${.18 + i * .06}" stroke-width="3"`); });
    } else if (k === "card") {
      s += `<rect x="0" y="${H - 170}" width="${W}" height="170" fill="#ebe0d1"/>`;
      [[1000, 1040], [860, 920], [720, 800], [580, 680]].forEach(([w, h], i) => { s += arch(600, H - 170 - i * 28, w, h, `fill="${["#f0dccd", "#ecd0c0", "#e7c3b2", "#e2b6a4"][i]}" stroke="#d4553f" stroke-opacity="${.18 + i * .06}" stroke-width="3"`); });
    } else if (k === "soft") {
      for (let i = 0; i < 9; i++) s += arch(140 + i * 280, H + 20, 200, 420 + (i % 3) * 120, `fill="${i % 2 ? "#e0cfba" : "#ddcab3"}" stroke="#d4553f" stroke-opacity=".16" stroke-width="3"`);
    } else if (k === "stay") {
      s += `<rect x="0" y="${H - 170}" width="${W}" height="170" fill="#efe5d8"/>`;
      s += arch(1540, H - 170, 1100, 1120, `fill="#f2dfd2"`) + arch(1540, H - 170 - 30, 900, 960, `fill="#ecd0c0" stroke="#d4553f" stroke-opacity=".2" stroke-width="3"`);
      s += arch(520, H - 170, 760, 860, `fill="#efe3d4" stroke="#d4553f" stroke-opacity=".14" stroke-width="3"`);
    }
    svg.innerHTML = s;
  });
}
function loadDevices() {
  document.querySelectorAll(`#${v} iframe[data-src]`).forEach((f) => { f.src = `?v=${f.dataset.src}`; });
}
// Showcase: isometric grid of front desk screens, each used once; slots that would show only a sliver are dropped
function buildGrid() {
  const host = document.querySelector(`#${v} .grid3d`);
  if (!host) return;
  const ids = ["a-stay", "a-home", "a-service-edit", "a-apartment-edit", "a-history", "a-services", "a-tv", "a-invite", "a-structures", "a-guest", "a-activate", "a-apartments", "a-structure-edit", "a-users", "a-login"];
  const SW = 1440, SH = 900, gap = 90, cols = 8, rows = 7;
  const box = host.getBoundingClientRect();
  const inner = document.createElement("div");
  host.appendChild(inner);
  const layout = (s) => {
    inner.innerHTML = "";
    Object.assign(inner.style, { position: "absolute", left: "0px", top: "0px", transformOrigin: "0 0", transform: `translate(${box.width * .5}px, ${box.height * .5}px) scale(${s}) rotateX(52deg) rotateZ(-38deg) translate(${-cols * (SW + gap) / 2}px, ${-rows * (SH + gap) / 2}px)` });
    const slots = [];
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      const d = document.createElement("div");
      Object.assign(d.style, { position: "absolute", left: c * (SW + gap) + "px", top: r * (SH + gap) + (c % 2) * 380 + "px", width: SW + "px", height: SH + "px" });
      inner.appendChild(d);
      const b = d.getBoundingClientRect();
      const vw = Math.max(0, Math.min(b.right, box.right) - Math.max(b.left, box.left)), vh = Math.max(0, Math.min(b.bottom, box.bottom) - Math.max(b.top, box.top));
      slots.push([d, (vw * vh) / (b.width * b.height), Math.hypot(b.left + b.width / 2 - box.left - box.width / 2, b.top + b.height / 2 - box.top - box.height / 2)]);
    }
    return slots;
  };
  let s = .3, slots;
  for (; s < 1; s += .02) { slots = layout(s); if (slots.filter(([, f]) => f > .3).length <= ids.length) break; }
  slots.sort((a, b) => a[2] - b[2]);
  let k = 0;
  slots.forEach(([d, f]) => {
    if (f <= .3 || k >= ids.length) return d.remove();
    const fr = document.createElement("iframe");
    fr.className = "shot"; fr.src = `?v=${ids[k++]}`;
    Object.assign(fr.style, { left: d.style.left, top: d.style.top, width: SW + "px", height: SH + "px" });
    d.replaceWith(fr);
  });
  document.body.setAttribute("data-slots", k);
}

const run = async () => {
  // load every face up front: text built later would otherwise stay invisible (display=block) when the render ends
  await Promise.all(["300", "400", "500", "600", "700"].map((w) => document.fonts.load(`${w} 16px Jost`)).concat(["400", "500"].map((w) => document.fonts.load(`${w} 16px "Bodoni Moda"`)), document.fonts.load(`italic 400 16px "Bodoni Moda"`)));
  await document.fonts.ready;
  const el = document.getElementById(v);
  if (builders[v]) el.innerHTML = builders[v]();
  if (builders[v]) Object.assign(el.style, v.startsWith("m-") ? { width: "390px", height: "844px" } : v.startsWith("tv-") ? { width: "1920px", height: "1080px" } : { width: "1440px", height: "900px" });
  drawArches();
  loadDevices();
  buildGrid();
};
run();
</script>
