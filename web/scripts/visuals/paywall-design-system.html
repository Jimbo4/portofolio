<!doctype html>
<!--
  Hero and card for the Paywall Design System case study (Matcha model: the title, large, in the project's own identity).
  Identity used only in these images: peach ground, deep violet ink, tangerine / lilac / butter stickers,
  Bricolage Grotesque. Render with scripts/render-visual.sh (views: hero 2400x1200, card 1200x1500 → 960).
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=block" rel="stylesheet">
<style>
  :root { --peach: #ffd9c2; --ink: #231942; --tangerine: #ff7a45; --lilac: #9b7bff; --butter: #ffd45c; --cream: #fff4ea; }
  * { margin: 0; box-sizing: border-box; }
  html, body { overflow: hidden; }
  .view { display: none; position: relative; overflow: hidden; background: var(--peach); }
  .view.on { display: block; }
  .abs { position: absolute; }
  .title { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-variation-settings: "opsz" 96; color: var(--ink); letter-spacing: -0.045em; line-height: .9; }
  .phone { position: absolute; overflow: hidden; border-radius: 64px; border: 14px solid var(--ink); background: var(--ink); box-shadow: 0 50px 90px rgba(35, 25, 66, .28); }
  .phone img { display: block; width: 100%; height: auto; }
  svg.sticker { position: absolute; overflow: visible; }
</style>
</head>
<body>

<!-- Stickers: flat shapes with an ink outline, drawn in a 100×100 box -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="crown" viewBox="0 0 100 100">
      <path d="M12 72 L8 28 L32 48 L50 18 L68 48 L92 28 L88 72 Z" fill="var(--butter)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
      <rect x="12" y="72" width="76" height="14" rx="5" fill="var(--butter)" stroke="var(--ink)" stroke-width="5"/>
      <circle cx="50" cy="56" r="7" fill="var(--tangerine)" stroke="var(--ink)" stroke-width="4"/>
    </symbol>
    <symbol id="lock" viewBox="0 0 100 100">
      <path d="M30 46 V30 a20 20 0 0 1 40 0 V22" fill="none" stroke="var(--ink)" stroke-width="9" stroke-linecap="round"/>
      <rect x="16" y="44" width="68" height="50" rx="14" fill="var(--lilac)" stroke="var(--ink)" stroke-width="5"/>
      <circle cx="50" cy="66" r="7" fill="var(--ink)"/><rect x="47" y="66" width="6" height="14" rx="3" fill="var(--ink)"/>
    </symbol>
    <symbol id="tag" viewBox="0 0 100 100">
      <path d="M46 8 H86 a6 6 0 0 1 6 6 V54 L50 96 L4 50 Z" fill="var(--tangerine)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="74" cy="26" r="8" fill="var(--peach)" stroke="var(--ink)" stroke-width="4"/>
    </symbol>
    <symbol id="check" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42" fill="var(--cream)" stroke="var(--ink)" stroke-width="5"/>
      <path d="M30 52 L44 66 L72 36" fill="none" stroke="var(--ink)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="burst" viewBox="0 0 100 100">
      <path d="M50 4 L58 30 L84 16 L70 42 L96 50 L70 58 L84 84 L58 70 L50 96 L42 70 L16 84 L30 58 L4 50 L30 42 L16 16 L42 30 Z" fill="var(--lilac)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="spark" viewBox="0 0 100 100">
      <path d="M50 4 C53 36 64 47 96 50 C64 53 53 64 50 96 C47 64 36 53 4 50 C36 47 47 36 50 4 Z" fill="var(--butter)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="pill" viewBox="0 0 200 100">
      <rect x="6" y="18" width="188" height="64" rx="32" fill="var(--ink)"/>
      <circle cx="156" cy="50" r="22" fill="var(--butter)"/>
    </symbol>
  </defs>
</svg>

<!-- ============ HERO 2400x1200 ============ -->
<section class="view" id="hero" style="width:2400px;height:1200px">
  <svg class="sticker" style="left:150px;top:120px;width:300px;height:300px;transform:rotate(-14deg)"><use href="#crown"/></svg>
  <svg class="sticker" style="left:560px;top:110px;width:110px;height:110px"><use href="#spark"/></svg>
  <svg class="sticker" style="left:1930px;top:110px;width:270px;height:270px;transform:rotate(12deg)"><use href="#lock"/></svg>
  <svg class="sticker" style="left:1700px;top:300px;width:120px;height:120px"><use href="#burst"/></svg>
  <svg class="sticker" style="left:120px;top:800px;width:290px;height:290px;transform:rotate(18deg)"><use href="#tag"/></svg>
  <svg class="sticker" style="left:520px;top:960px;width:150px;height:150px;transform:rotate(-8deg)"><use href="#check"/></svg>
  <svg class="sticker" style="left:1820px;top:860px;width:420px;height:210px;transform:rotate(-10deg)"><use href="#pill"/></svg>
  <svg class="sticker" style="left:1560px;top:990px;width:110px;height:110px"><use href="#spark"/></svg>
  <div class="abs title" style="left:0;right:0;top:330px;text-align:center;font-size:290px">Paywall<br>Design System</div>
</section>

<!-- ============ CARD 1200x1500 ============ -->
<section class="view" id="card" style="width:1200px;height:1500px">
  <div class="abs title" style="left:90px;top:100px;font-size:168px">Paywall<br>Design System</div>
  <svg class="sticker" style="left:930px;top:470px;width:200px;height:200px;transform:rotate(14deg)"><use href="#crown"/></svg>
  <svg class="sticker" style="left:-40px;top:1080px;width:240px;height:240px;transform:rotate(-16deg)"><use href="#tag"/></svg>
  <div class="phone" style="left:120px;top:520px;width:500px;transform:rotate(-7deg)"><img src="../../public/images/case-studies/paywall-design-system/paywall-fashion.webp" alt=""></div>
  <div class="phone" style="left:590px;top:640px;width:500px;transform:rotate(5deg)"><img src="../../public/images/case-studies/paywall-design-system/paywall-gaming.webp" alt=""></div>
  <svg class="sticker" style="left:1010px;top:1300px;width:130px;height:130px"><use href="#spark"/></svg>
</section>

<script>
  const v = new URLSearchParams(location.search).get("v") || "hero";
  document.getElementById(v).classList.add("on");
</script>
</body>
</html>
