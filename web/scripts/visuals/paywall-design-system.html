<!doctype html>
<!--
  Hero and card for the Paywall Design System case study (Matcha model: the title, large, in the project's own identity).
  Identity used only in these images: black with liquid-chrome reflections turning to silver, made only with color and
  a WebGL fragment shader (no icons). Title in Leckerli One (bold retro script), white with a silver sheen.
  Render with scripts/render-visual.sh (views: hero 2400x1200, card 1200x1500 → 960).
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Leckerli+One&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: #050506; }
  .view { display: none; position: relative; overflow: hidden; background: #050506; }
  .view.on { display: block; }
  .abs { position: absolute; }
  canvas.chrome { position: absolute; inset: 0; }
  /* Soft dark pool behind the title so it reads over the reflections */
  .scrim { position: absolute; pointer-events: none; }
  .title {
    font-family: "Leckerli One", cursive; font-weight: 400; letter-spacing: -0.02em; line-height: .92; padding: .05em .12em .18em;
    background: linear-gradient(172deg, #ffffff 0%, #f3f5f8 36%, #b7bdc6 54%, #eef1f4 70%, #ffffff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 8px 30px rgba(0, 0, 0, .55));
  }
  .phone {
    position: absolute; overflow: hidden; border-radius: 64px; border: 14px solid #0d0e10; background: #0d0e10;
    box-shadow: 0 0 0 2px rgba(220, 226, 235, .35), 0 60px 110px rgba(0, 0, 0, .7);
  }
  .phone img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>

<!-- ============ HERO 2400x1200 ============ -->
<section class="view" id="hero" style="width:2400px;height:1200px">
  <canvas class="chrome" width="2400" height="1200" data-seed="3.1" data-scale="1.0"></canvas>
  <div class="scrim" style="inset:0;background:radial-gradient(52% 46% at 50% 52%, rgba(5,5,6,.82), rgba(5,5,6,.35) 60%, transparent 85%)"></div>
  <div class="abs title" style="left:0;right:0;top:290px;text-align:center;font-size:270px;transform:rotate(-6deg)">Paywall<br>Design System</div>
</section>

<!-- ============ CARD 1200x1500 ============ -->
<section class="view" id="card" style="width:1200px;height:1500px">
  <canvas class="chrome" width="1200" height="1500" data-seed="7.4" data-scale="1.25"></canvas>
  <div class="scrim" style="left:0;top:0;width:1200px;height:560px;background:linear-gradient(180deg, rgba(5,5,6,.85), rgba(5,5,6,.4) 70%, transparent)"></div>
  <div class="abs title" style="left:50px;top:70px;font-size:160px;transform:rotate(-6deg)">Paywall<br>Design System</div>
  <div class="phone" style="left:120px;top:520px;width:500px;transform:rotate(-7deg)"><img src="../../public/images/case-studies/paywall-design-system/paywall-fashion.webp" alt=""></div>
  <div class="phone" style="left:590px;top:640px;width:500px;transform:rotate(5deg)"><img src="../../public/images/case-studies/paywall-design-system/paywall-gaming.webp" alt=""></div>
</section>

<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 p; out vec2 uv;
void main() { uv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }
</script>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec2 uv; out vec4 color;
uniform vec2 res; uniform float seed; uniform float scale;

// Value noise + fbm
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7)) + seed * 17.0) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) { float v = 0., a = .5; for (int k = 0; k < 4; k++) { v += a * noise(p); p = p * 2.03 + 3.7; a *= .5; } return v; }

// Domain-warped height field: slow folds like liquid metal or satin
float height(vec2 p) {
  vec2 q = vec2(fbm(p + vec2(0., seed)), fbm(p + vec2(5.2, 1.3)));
  vec2 r = vec2(fbm(p + 3.0 * q + vec2(1.7, 9.2)), fbm(p + 3.0 * q + vec2(8.3, 2.8)));
  return fbm(p + 1.8 * r);
}

// Studio environment seen in the reflection: dark room with long soft light strips
vec3 env(vec3 d) {
  float strips = pow(max(0., sin(d.x * 2.2 + d.y * 3.6 + 0.6)), 6.) * 2.0
               + pow(max(0., sin(d.x * -3.0 + d.y * 2.0 + 2.1)), 14.) * 1.6;
  float sky = smoothstep(-.1, .9, d.y) * .3;
  vec3 cool = vec3(.80, .85, .93);
  return cool * (strips + sky) + vec3(.012);
}

void main() {
  vec2 p = (uv - .5) * vec2(res.x / res.y, 1.) * .46 * scale;
  float e = 1.5 / res.y * .46 * scale;
  float h = height(p);
  vec2 g = vec2(height(p + vec2(e, 0.)) - h, height(p + vec2(0., e)) - h) / e;
  vec3 n = normalize(vec3(-g * .32, 1.));
  vec3 v = vec3(0., 0., 1.);
  vec3 rdir = reflect(-v, n);
  float fres = pow(1. - max(dot(n, v), 0.), 3.);
  vec3 c = env(rdir) * (.45 + 1.6 * fres) + fres * vec3(.7, .73, .78);
  c = c / (1. + c);                    // soft tone map
  c = pow(c, vec3(.9));
  float vig = smoothstep(1.25, .25, length((uv - .5) * vec2(1.1, 1.3)));
  c *= mix(.45, 1., vig);
  color = vec4(c, 1.);
}
</script>
<script>
  const v = new URLSearchParams(location.search).get("v") || "hero";
  document.getElementById(v).classList.add("on");

  const canvas = document.querySelector(".view.on canvas.chrome");
  const gl = canvas.getContext("webgl2", { preserveDrawingBuffer: true });
  const compile = (type, id) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, document.getElementById(id).textContent);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
    return shader;
  };
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, "vs"));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, "fs"));
  gl.linkProgram(program);
  gl.useProgram(program);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(program, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(gl.getUniformLocation(program, "res"), canvas.width, canvas.height);
  gl.uniform1f(gl.getUniformLocation(program, "seed"), Number(canvas.dataset.seed));
  gl.uniform1f(gl.getUniformLocation(program, "scale"), Number(canvas.dataset.scale));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
</script>
</body>
</html>
